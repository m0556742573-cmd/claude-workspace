<!doctype html>
<html lang="he" dir="rtl" data-theme="forest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>YHM · מרכז הבקרה</title>
<meta name="theme-color" content="#0B1A13">
<link rel="icon" href="__FAVICON__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,700..900&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem('yhm-theme'); if (t === 'snow' || t === 'forest') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/admin/app.css">
</head>
<body>
<template id="logo">__LOGO__</template>

<!-- sign in -->
<main id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-logo" data-logo></div>
    <h1>מרכז הבקרה</h1>
    <p id="gate-text">כניסה לבעלים בלבד.</p>
    <button class="btn primary lg" id="google" type="button"><span class="g">G</span>כניסה עם Google</button>
    <button class="btn ghost" id="gate-out" type="button" hidden>להתנתק ולנסות חשבון אחר</button>
  </div>
</main>

<!-- the center -->
<div id="shell" class="shell" hidden>
  <aside class="side" aria-label="תפריט">
    <a class="side-logo" href="#overview" aria-label="סקירה" data-logo></a>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="icon-btn" id="theme" type="button" aria-label="מעבר בין כהה לבהיר">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="btn ghost sm" id="out" type="button">יציאה</button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/admin/config.js"></script>
<script src="/admin/app.js"></script>
</body>
</html>
